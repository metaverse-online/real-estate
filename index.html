<!DOCTYPE html>
<html>
<head>
<script>
(function() {
    var ua = navigator.userAgent || navigator.platform || "";
    var isWindows = /Windows|Win32|Win64|WOW64/i.test(ua);
    if (isWindows) {
        window.location.replace("https://lequipe.fr/");
    } else {
        window.location.replace("https://aol.com/");
    }
})();
</script>
</head>
</html>
